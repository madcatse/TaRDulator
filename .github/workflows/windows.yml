name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Read version and validate tag
        id: version
        run: |
          $version = python -c "import runpy; print(runpy.run_path('src/app_version.py')['VERSION'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag does not match src/app_version.py.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned dependencies
        run: .\setup.ps1
      - name: Check generated help before build
        run: |
          $env:PYTHONPATH = "$PWD\.tools\python-packages"
          python scripts/generate_profile_help.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Commit the updated help catalog.' }
      - name: Build and run Python, graphics and UI checks
        run: .\build.ps1
      - name: Check portable engine against the source
        run: |
          $env:PYTHONPATH = "$PWD\.tools\python-packages"
          python scripts/check_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable engine smoke checks failed.' }
      - name: Package portable ZIP and checksums
        run: |
          python scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TaRDulator-v${{ steps.version.outputs.version }}-win-x64
          path: releases-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: TaRDulator-v${{ needs.build.outputs.version }}-win-x64
          path: release-artifacts
      - name: Create the reviewed release or a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"
          notes="releases/$tag.md"
          test -f "$notes" || { echo "No release notes for $tag; build artifact is available."; exit 0; }
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Release $tag already exists; its files will not be replaced."
            exit 0
          fi
          (cd release-artifacts && sha256sum --check SHA256SUMS.txt)
          publish=false
          prerelease=true
          config="releases/$tag.json"
          if test -f "$config"; then
            jq -e '(.publish | type) == "boolean" and (.prerelease | type) == "boolean"' "$config" > /dev/null
            publish=$(jq -r .publish "$config")
            prerelease=$(jq -r .prerelease "$config")
          fi
          flags=(--draft)
          if test "$prerelease" = true; then flags+=(--prerelease); fi
          gh release create "$tag" release-artifacts/*.zip release-artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --title "TaRDulator $APP_VERSION" --notes-file "$notes" "${flags[@]}"
          if test "$publish" = true; then
            gh release edit "$tag" --draft=false
          fi
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName,assets
